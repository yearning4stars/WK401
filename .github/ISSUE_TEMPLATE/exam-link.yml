name: เสนอลิงก์ข้อสอบ
description: เสนอข้อสอบจริงที่เจ้าของเผยแพร่เป็นสาธารณะ เพื่อเพิ่มในดัชนีของเรื่องที่เกี่ยวข้อง
title: "[ข้อสอบ] "
labels: ["exam-link"]
body:
  - type: markdown
    attributes:
      value: |
        โปรเจกต์เก็บเฉพาะ **ลิงก์** ไปหน้าต้นทางที่เจ้าของข้อสอบเผยแพร่เอง กรุณาไม่แนบไฟล์ข้อสอบหรือคัดลอกโจทย์มาในฟอร์มนี้
  - type: input
    id: topic
    attributes:
      label: เรื่องที่เกี่ยวข้อง
      description: ใส่ id ของเรื่อง เช่น m4/physics/newtons-laws
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: แหล่งข้อสอบ
      description: ชื่อหน่วยงานหรือชื่อการสอบ
    validations:
      required: true
  - type: input
    id: year
    attributes:
      label: ปีที่สอบ (พ.ศ.)
      placeholder: "2566"
    validations:
      required: true
  - type: input
    id: item
    attributes:
      label: ข้อที่เกี่ยวข้องกับเรื่องนี้
      placeholder: ข้อ 5-8
  - type: input
    id: url
    attributes:
      label: ลิงก์หน้าต้นทาง
      description: ต้องขึ้นต้นด้วย https:// และเป็นหน้าที่เจ้าของข้อสอบเผยแพร่เอง
    validations:
      required: true
  - type: dropdown
    id: access
    attributes:
      label: ต้องล็อกอินหรือเสียเงินหรือไม่
      options:
        - เปิดได้ฟรีโดยไม่ต้องล็อกอิน
        - ต้องล็อกอิน
        - มีค่าใช้จ่าย
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: ยืนยัน
      options:
        - label: ลิงก์นี้เป็นหน้าที่เจ้าของข้อสอบเผยแพร่เอง ไม่ใช่เว็บที่นำข้อสอบไปแจกโดยไม่ได้รับอนุญาต
          required: true
